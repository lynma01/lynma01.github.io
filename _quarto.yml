project:
  type: website
  output-dir: docs
  render:
    - "*.qmd" 

website:
  title: "lynma01.github.io"
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - href: posts/home.qmd
        text: Home
  open-graph:
    locale: es_ES
    site-name: "lynma01.github.io"
    image: "home_images/acrdb.svg"

format:
  html:
    # html themes from bootswatch
    brand: _brand.yml
    csl: "style/cell.csl"
    theme:
      light: sandstone 
      dark:  cyborg
    # text formatting for table of contents, chapters, etc.
    toc: true
    number-sections: true    
    crossref:
      chapters: true
    code-fold: true
    code-summary: "Code:"
    linestretch: 1.20
    body-font: "Atkinson Hyperlegible Next"
    heading-font: "Atkinson Hyperlegible Next"

    code-line-numbers: true
    # for Mermaid digrams and other extensions
    mermaid:
      theme: forest